# Deploys main to the Cloudflare Pages project that serves olivergreig.com.
#
# Only the site files are uploaded (top-level *.html, *.txt, *.xml and the
# Pages _headers/_redirects files), never .github or scripts.
#
# Needs, set by ROOT:
#   secret   CLOUDFLARE_API_TOKEN       Pages:Edit on the account
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable CLOUDFLARE_PAGES_PROJECT   e.g. olivergreig-com
# Until CLOUDFLARE_PAGES_PROJECT is set the job is skipped.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Stage site files
        run: |
          mkdir dist
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.txt' -o -name '*.xml' -o -name '_headers' -o -name '_redirects' \) -exec cp {} dist/ \;
          ls -la dist
          test -f dist/index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
