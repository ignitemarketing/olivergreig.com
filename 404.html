<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Page not found — Oliver Greig</title>
  <meta name="description" content="That page does not exist on olivergreig.com.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='45' font-family='system-ui,sans-serif' font-size='40' text-anchor='middle' fill='%23111'%3EO%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --fg: #111;
      --muted: #555;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --fg: #fafafa;
        --muted: #a0a0a0;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 32rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 1.125rem;
    }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.15em;
    }
  </style>
</head>

<body>
  <main>
    <h1>Page not found</h1>
    <p>There is nothing at this address.</p>
    <p><a href="/">Back to the homepage</a></p>
  </main>
</body>

</html>
